name: Package tooling checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/cache-input
        with:
          filename: n97-ngage.sisx
      - name: Check upstream package integrity and extraction
        env:
          NGAGE_VALIDATION_INPUTS: ${{ github.workspace }}/downloads
        run: python3 -m unittest discover -s tests -v
