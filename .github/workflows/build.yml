name: Build unsigned Symbian installer
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to create from this build, e.g. v1.0.0
        required: false
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: ./.github/actions/cache-input
        with:
          filename: n97-ngage.sisx
      - uses: ./.github/actions/cache-input
        with:
          filename: symbian-sdk-0.3.0-linux-x86_64.tar.gz
          manifest: validation/sdk.json
      - uses: ./.github/actions/cache-input
        with:
          filename: ynstallserver-belle-fixture.exe
          manifest: validation/hacked-x7.json
      - name: Install pinned build tooling
        run: pip install -r requirements-build.txt
      - name: Extract SDK
        run: |
          mkdir -p "$RUNNER_TEMP/symbian-sdk"
          tar -xzf downloads/symbian-sdk-0.3.0-linux-x86_64.tar.gz -C "$RUNNER_TEMP/symbian-sdk" --strip-components=1
      - name: Build and verify installer
        run: |
          python tools/build.py --sdk "$RUNNER_TEMP/symbian-sdk" --installer downloads/n97-ngage.sisx
      - name: Check compiled adapters and package tooling
        env:
          NGAGE_SDK: ${{ runner.temp }}/symbian-sdk
          NGAGE_VALIDATION_INPUTS: downloads
          NGAGE_INSTALL_SERVICE: downloads/ynstallserver-belle-fixture.exe
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: ngage-installer-symbian3-unsigned
          path: artifacts/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ngage-installer-symbian3-unsigned
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/ngage-installer-symbian3.sis \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Install ngage-installer-symbian3.sis on a hacked Symbian^3 or Belle phone. See the README for instructions and known issues."
