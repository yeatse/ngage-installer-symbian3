name: Cached validation input
description: Restore one SHA-256-pinned external input and verify it before use.
inputs:
  filename:
    description: Filename from validation/inputs.json
    required: true
  manifest:
    description: Repository-relative hash manifest
    default: validation/inputs.json
outputs:
  path:
    description: Repository-relative path to the verified input
    value: ${{ steps.input.outputs.path }}
runs:
  using: composite
  steps:
    - id: input
      shell: bash
      env:
        INPUT_FILENAME: ${{ inputs.filename }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        name = os.environ['INPUT_FILENAME']
        entries = json.loads(Path(os.environ['INPUT_MANIFEST']).read_text())
        entry = next(item for item in entries if item['filename'] == name)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f"sha256={entry['sha256']}\n")
            output.write(f"path=downloads/{entry['filename']}\n")
        PY
    - uses: actions/cache@v4
      with:
        path: ${{ steps.input.outputs.path }}
        key: ngage-input-v1-${{ steps.input.outputs.sha256 }}
    - name: Download if missing and verify SHA-256
      shell: bash
      env:
        INPUT_FILENAME: ${{ inputs.filename }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: python3 tools/fetch_inputs.py downloads --manifest "$INPUT_MANIFEST" --only "$INPUT_FILENAME"
