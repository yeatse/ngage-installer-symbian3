; N-Gage 2.0 keyboard mapping. Copy to C:\Data\N-Gage\keymap.ini on the phone.
; One "Key = Button" per line; ';' starts a comment. Changes apply the next time a game starts.
;
; Keys:    A-Z, 0-9, Space, Enter, Backspace, Up, Down, Left, Right, Comma, Period,
;          or a scan code such as 0x79.
; Buttons: Up, Down, Left, Right, OK, A, B, L, R, 0-9, *, # and C (the keypad's clear key).
;
; Example: an E7 layout with the keypad on the left of the keyboard.
Q = A
A = B
W = 1
E = 2
R = 3
S = 4
D = 5
F = 6
X = 7
C = 8
V = 9
Z = 0
